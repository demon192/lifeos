# Gradle settings for the whole project.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Use AndroidX (modern support libraries). Required by everything above.
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Only build the resources for the languages/densities we ship (faster builds).
android.nonTransitiveRClass=true
